<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}延展设计{% endblock %} — 抟力数智</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #D31145;
      --charcoal: #333D47;
      --gray: #f4f4f5;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { font-family: var(--font); background: var(--gray); color: var(--text); min-height: 100vh; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      background: white; border-bottom: 1px solid var(--border);
      padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-weight: 700; font-size: 15px; color: var(--red); letter-spacing: -0.3px; }
    .logo span { color: var(--charcoal); }
    nav { display: flex; gap: 4px; }
    nav a {
      padding: 6px 12px; border-radius: 6px; font-size: 13px; text-decoration: none;
      color: var(--muted); transition: background 0.15s, color 0.15s;
    }
    nav a:hover { background: var(--gray); color: var(--text); }
    nav a.active { background: var(--red); color: white; }
    main { flex: 1; padding: 40px 32px; max-width: 960px; margin: 0 auto; width: 100%; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
    .card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--charcoal); text-transform: uppercase; letter-spacing: 0.5px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--charcoal); }
    input[type=text], textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: var(--font);
      outline: none; transition: border-color 0.15s;
    }
    input[type=text]:focus, textarea:focus, select:focus { border-color: var(--red); }
    textarea { resize: vertical; min-height: 100px; }
    .btn {
      padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: opacity 0.15s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: var(--red); color: white; }
    .btn-secondary { background: white; color: var(--charcoal); border: 1px solid var(--border); }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .error { background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius); padding: 12px 16px; color: #b91c1c; font-size: 13px; margin-bottom: 16px; display: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step-indicator { display: flex; gap: 0; margin-bottom: 32px; }
    .step { flex: 1; padding: 10px 16px; font-size: 12px; font-weight: 600; text-align: center; background: white; border: 1px solid var(--border); border-right: none; color: var(--muted); }
    .step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .step:last-child { border-right: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; }
    .step.active { background: var(--red); color: white; border-color: var(--red); }
    .step.done { background: var(--charcoal); color: white; border-color: var(--charcoal); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">延展设计 <span>· 抟力数智</span></div>
    <nav>
      <a href="/" class="{% block nav1 %}{% endblock %}">1 品牌</a>
      <a href="/profile" class="{% block nav2 %}{% endblock %}">2 档案</a>
      <a href="/generate" class="{% block nav3 %}{% endblock %}">3 生成</a>
      <a href="/review" class="{% block nav4 %}{% endblock %}">4 审核</a>
      <a href="/results" class="{% block nav5 %}{% endblock %}">5 结果</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</div>
<script>
  // Global state (session storage for page-to-page handoff)
  const state = {
    get: (k) => { try { return JSON.parse(sessionStorage.getItem('hp_' + k)); } catch { return null; } },
    set: (k, v) => sessionStorage.setItem('hp_' + k, JSON.stringify(v)),
  };
  function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }
  function hideError(el) { el.style.display = 'none'; }
  async function api(path, method, body) {
    const res = await fetch(path, {
      method, headers: {'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
